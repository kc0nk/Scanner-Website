[project]
name = "ctf-exploit-workbench"
version = "3.45.0"
description = "Desktop CTF web security testing workbench"
requires-python = ">=3.11"

[tool.ctf-workbench]
# Source-layout metadata only. Runtime behavior is intentionally unchanged.
# Keep the PySide6 desktop UI and scanner/repeater architecture intact.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# This project is intentionally not auto-rewritten by a linter. These rules
# document the source-quality target for future maintenance.
select = ["E", "F", "W", "I"]
ignore = ["E501"]
